name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard-library checks: permission schema, JSONC, README links.
      - name: Validate config (stdlib only)
        run: python scripts/validate_config.py

      # Second opinion: real YAML parser, so contributors cannot sneak in syntax
      # the subset parser above would misread.
      - name: Parse frontmatter with PyYAML
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python scripts/ci_yaml_check.py

      - name: Shell syntax (bash -n)
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("install.ps1", "uninstall.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "::error file=$file::$($_.Message)" }
            } else {
              Write-Host "OK   $file"
            }
          }
          if ($failed) { exit 1 }

      # Smoke test: install into a throwaway config dir, reinstall (backup path),
      # then uninstall and confirm the directory is back to its original state.
      - name: Install / reinstall / uninstall round-trip
        shell: bash
        env:
          CFG: ${{ runner.temp }}/ocpm-smoke
        run: |
          set -euo pipefail

          rm -rf "$CFG"
          mkdir -p "$CFG/agent"
          printf '%s\n' "user-owned" > "$CFG/agent/read-only.md"

          OPENCODE_CONFIG_DIR="$CFG" ./install.sh
          test -f "$CFG/agent/read-only.md"
          test -f "$CFG/agent/auto-edit.md"
          test -f "$CFG/agent/full-auto.md"
          test -f "$CFG/opencode.jsonc"
          grep -q "read-only.md" "$CFG/.opencode-permission-modes.manifest"

          OPENCODE_CONFIG_DIR="$CFG" ./install.sh
          ls "$CFG"/agent/*.bak >/dev/null

          OPENCODE_CONFIG_DIR="$CFG" ./uninstall.sh --yes
          test ! -f "$CFG/agent/auto-edit.md"
          test ! -f "$CFG/agent/full-auto.md"
          test -f "$CFG/agent/read-only.md"
          grep -q "user-owned" "$CFG/agent/read-only.md"
          test ! -f "$CFG/.opencode-permission-modes.manifest"
          test -f "$CFG/opencode.jsonc"

          echo "round-trip OK"
